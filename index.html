 answered=false;busy=false;$('msg').textContent='';$('score').textContent='⭐ '+score;$('next').classList.add('hidden');
 if(mode===3){newPairs();return}
 if(!decks[mode]||!decks[mode].length){const n=pool().length,basics=mode===0?12:mode===1?16:mode===2?12:24;decks[mode]=shuffle(Array.from({length:n-basics},(_,i)=>i+basics)).concat(shuffle(Array.from({length:basics},(_,i)=>i)))}
 target=decks[mode].pop();selection=choicesFor();render()
}
function fruitArt(i){
 const colors={leaf:'#379f55',dark:'#266c3c'};
 const svgHead='<svg aria-hidden="true" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">';
 const berry=(fill,outline)=>Array.from({length:4},(_,r)=>Array.from({length:3},(_,c)=>'<circle cx="'+(35+c*15+(r%2)*5)+'" cy="'+(27+r*14)+'" r="10" fill="'+fill+'" stroke="'+outline+'" stroke-width="2"/>').join('')).join('')+'<path d="M35 24 Q50 5 65 24 L51 19Z" fill="#3c9a52"/>';
 const art={
 36:'<ellipse cx="50" cy="60" rx="36" ry="30" fill="#f79522"/><ellipse cx="36" cy="60" rx="17" ry="30" fill="#ffaf34"/><ellipse cx="64" cy="60" rx="17" ry="30" fill="#ed7d1a"/><path d="M49 34 L53 18" stroke="#4f8d35" stroke-width="8" stroke-linecap="round"/>',
 37:berry('#e83243','#c92a39'),38:berry('#3d235a','#24143c'),

 40:'<circle cx="50" cy="59" r="32" fill="#b72240"/><path d="M36 31 L38 17 50 25 62 17 65 31 Z" fill="#b72240"/><circle cx="40" cy="60" r="9" fill="#e95464" opacity=".45"/>',
 41:'<path d="M50 16 C48 38 20 46 25 71 C30 99 70 99 75 71 C80 46 52 38 50 16Z" fill="#8e4b97"/><path d="M47 27 C37 61 36 78 48 88" stroke="#c48bc9" stroke-width="6" opacity=".6" fill="none"/>',
 42:'<path d="M50 14 V53" stroke="#6d963b" stroke-width="6"/><ellipse cx="30" cy="61" rx="13" ry="25" fill="#8a4e29" transform="rotate(15 30 61)"/><ellipse cx="63" cy="60" rx="13" ry="25" fill="#a96b36" transform="rotate(-15 63 60)"/><path d="M32 58 L34 76 M65 54 L66 77" stroke="#ce975c" stroke-width="3"/>',
 43:'<circle cx="50" cy="58" r="31" fill="#ffab30"/><path d="M49 25 Q33 15 28 29 L48 36 Q65 14 74 30 L54 36Z" fill="#348b40"/>',
 44:'<ellipse cx="50" cy="59" rx="32" ry="28" fill="#ff9921"/><path d="M49 30 Q62 13 76 24 Q65 36 49 30Z" fill="#389a4c"/><path d="M24 60 Q50 82 76 60" stroke="#ffb84c" fill="none" stroke-width="3"/>',
 45:'<circle cx="50" cy="55" r="37" fill="#f7c04f"/><circle cx="50" cy="55" r="30" fill="#f49d98"/><circle cx="50" cy="55" r="6" fill="#fff2da"/>'+Array.from({length:8},(_,j)=>{let a=j*Math.PI/4;return '<path d="M50 55 L'+(50+29*Math.cos(a))+' '+(55+29*Math.sin(a))+'" stroke="#fff3d6" stroke-width="3"/>'}).join(''),
 46:'<path d="M49 37 Q34 27 34 12 M50 37 Q66 27 67 11" stroke="#41a15a" stroke-width="11" fill="none" stroke-linecap="round"/><path d="M23 48 Q50 30 76 48 Q79 74 50 93 Q21 73 23 48Z" fill="#9a255b"/><path d="M50 91 L50 99" stroke="#a87077" stroke-width="3"/>',
 47:'<path d="M49 35 Q32 26 25 15 M48 35 Q60 19 70 11" stroke="#40a45c" stroke-width="11" fill="none" stroke-linecap="round"/><path d="M22 48 Q50 30 77 48 Q73 72 50 94 Q27 72 22 48" fill="#eb4171"/><path d="M31 73 Q50 94 68 73 Q57 89 50 94 Q42 87 31 73Z" fill="#fff8ee"/>',
 48:'<path d="M18 76 Q12 63 22 51 L71 25 Q88 22 91 39 Q91 49 78 53 L34 85 Q23 90 18 76Z" fill="#5baf48"/><path d="M27 76 L79 35 M37 78 L84 42" stroke="#89d077" stroke-width="4"/><path d="M77 28 L82 16" stroke="#287c35" stroke-width="7"/>',
 49:'<path d="M30 84 L42 37 M43 84 L49 30 M57 84 L57 37 M70 84 L62 29" stroke="#76b94d" stroke-width="10" stroke-linecap="round"/><path d="M43 33 Q20 2 14 28 Q23 49 43 33 M51 23 Q40 -1 63 8 Q72 27 51 23 M64 29 Q87 4 88 32 Q79 50 64 29" fill="#4e9d42"/>'
 };
 return svgHead+(art[i]||'')+'</svg>';
}
function render(){
 if(mode<0)return;
 if(mode===4){drawArcade();return}
 $('prompt').textContent=mode===3?t().pairPrompt:t().choose+' '+names()[target];
 $('choices').innerHTML='';
 if(mode===3){
  for(let i=0;i<pair.length;i++){
   let b=document.createElement('button');
   b.className='choice pair-card'+(flipped.includes(i)?' open':'')+(pair[i].done?' done':'');
   b.textContent=(flipped.includes(i)||pair[i].done)?pair[i].icon:'❔';
   b.setAttribute('aria-label',b.textContent);b.onclick=()=>flip(i);$('choices').appendChild(b)
  }
  return
 }
 for(const i of selection){
  const b=document.createElement('button');b.className='choice'+(mode===0?' color':'');
  if(mode===0){b.style.background=colors[i];b.style.borderColor=colors[i].toUpperCase()==='#FFFFFF'?'#D4D4D4':'transparent';b.setAttribute('aria-label',t().namescolors[i])}
  else{
   const symbol=document.createElement('span');symbol.className='figure';if(mode===5&&i>=36){symbol.classList.add('fruit-art');symbol.innerHTML=fruitArt(i)}else symbol.textContent=pool()[i];
   if(mode===2)symbol.style.color=['#F16678','#2E95D3','#B171DD','#29AA84'][i%4];
   const caption=document.createElement('span');caption.className='choice-name';caption.textContent=names()[i];
   b.appendChild(symbol);b.appendChild(caption)
  }
  b.onclick=()=>pick(i);$('choices').appendChild(b)
 }
 say(names()[target])
}
function pick(i){
 if(answered)return;
 if(i===target){answered=true;score++;$('score').textContent='⭐ '+score;
  $('msg').textContent=t().good[0];say(t().good[0]);autoAdvance(1600)
 }else{$('msg').textContent=t().again;say(t().again)}
}
let arcade=null,arcFrame=0,arcNext=0;
const levels=[
 {guys:[[260,95]],walls:[],barrels:[]},
 {guys:[[252,130]],walls:[[155,180,110,15]],barrels:[]},
 {guys:[[255,108],[260,320]],walls:[[120,210,90,14]],barrels:[]},
 {guys:[[250,125],[275,285]],walls:[[145,205,100,16]],barrels:[[225,245]]},
 {guys:[[90,100],[265,110],[265,320]],walls:[[120,185,130,16],[65,280,145,14]],barrels:[[255,268]]},
 {guys:[[85,90],[250,100],[255,280]],walls:[[90,160,135,15],[142,245,120,15]],barrels:[[230,225]]}
];
for(let level=7;level<=50;level++){
 const n=level-7,rows=(n%3)+1;
 const guys=Array.from({length:rows},(_,i)=>[205+((n*29+i*41)%85),75+i*105+((n*7)%15)]);
 const walls=n%4===0?[]:[[90+(n*17)%80,180+(n*13)%50,85+(n%3)*22,14]];
 const barrels=n%3===0?[[250,250]]:[];
 levels.push({guys,walls,barrels})
}
function stopArcade(){if(arcFrame)cancelAnimationFrame(arcFrame);arcFrame=0;clearTimeout(arcNext);arcNext=0;arcade=null}
function startArcade(){
 stopArcade();
 const n=Math.max(0,round-1),base=levels[Math.min(n,levels.length-1)];
 arcade={guys:base.guys.map(([x,y])=>({x,y,alive:true})),walls:base.walls.map(a=>a.slice()),barrels:base.barrels.map(([x,y])=>({x,y,alive:true})),shot:null,aim:{x:260,y:150},tries:0,won:false};
 $('controls').classList.add('hidden');$('prompt').textContent=(language==='ru'?'Уровень ':'Деңгей ')+round;
 $('msg').textContent=language==='ru'?'Нажми на поле — стреляй!':'Алаңды бас — ат!';
 $('choices').innerHTML='<canvas id="arcade" class="arcade" width="330" height="440" aria-label="Игра с рикошетом"></canvas><div class="arcade-note">'+(language==='ru'?'🎯 Веди пальцем для прицела, отпусти для выстрела':'🎯 Саусағыңмен көзде, жібергенде атады')+'</div>';
 $('choices').style.display='block';
 const can=$('arcade');
 let dragging=false,dragId=null;
 const point=e=>{const r=can.getBoundingClientRect();return {x:Math.max(8,Math.min(322,(e.clientX-r.left)*330/r.width)),y:Math.max(8,Math.min(432,(e.clientY-r.top)*440/r.height))}};
 can.addEventListener('pointerdown',e=>{if(!arcade||arcade.won||arcade.shot)return;dragging=true;dragId=e.pointerId;can.setPointerCapture(e.pointerId);arcade.aim=point(e);drawArcade()});
 can.addEventListener('pointermove',e=>{if(!dragging||e.pointerId!==dragId||!arcade||arcade.shot)return;arcade.aim=point(e);drawArcade()});
 can.addEventListener('pointerup',e=>{if(!dragging||e.pointerId!==dragId)return;dragging=false;dragId=null;if(!arcade||arcade.won||arcade.shot)return;arcade.aim=point(e);shootArcade(arcade.aim.x,arcade.aim.y)});
 can.addEventListener('pointercancel',()=>{dragging=false;dragId=null});
 drawArcade();
}
function shootArcade(x,y){
 if(!arcade)return;let dx=x-48,dy=y-372,mag=Math.hypot(dx,dy)||1;
 arcade.aim={x,y};arcade.shot={x:48,y:372,vx:dx/mag*5.8,vy:dy/mag*5.8,t:0,bounces:0};
 arcade.tries++;if(!arcFrame)arcFrame=requestAnimationFrame(tickArcade);
}
function tickArcade(){
 arcFrame=0;if(!arcade||mode!==4)return;
 const a=arcade,p=a.shot;
 if(p){
  for(let z=0;z<3;z++){
   const ox=p.x,oy=p.y;
   p.x+=p.vx/3;p.y+=p.vy/3;p.t++;
   if(p.x<9){p.x=9;p.vx=Math.abs(p.vx);p.bounces++}
   if(p.x>321){p.x=321;p.vx=-Math.abs(p.vx);p.bounces++}
   if(p.y<9){p.y=9;p.vy=Math.abs(p.vy);p.bounces++}
   if(p.y>427){p.y=427;p.vy=-Math.abs(p.vy);p.bounces++}
   for(const [wx,wy,ww,wh] of a.walls){
    if(p.x>wx-7&&p.x<wx+ww+7&&p.y>wy-7&&p.y<wy+wh+7){
      if(ox<wx-7||ox>wx+ww+7)p.vx*=-1;else p.vy*=-1;
      p.x=ox;p.y=oy;p.bounces++;
    }
   }
   let hitTarget=false;
   for(const b of a.barrels){
    if(b.alive&&Math.hypot(p.x-b.x,p.y-b.y)<23){
     b.alive=false;hitTarget=true;
     for(const g of a.guys)if(g.alive&&Math.hypot(b.x-g.x,b.y-g.y)<110)g.alive=false;
     break;
    }
   }
   if(!hitTarget)for(const g of a.guys){
    if(g.alive&&Math.hypot(p.x-g.x,p.y-g.y)<24){g.alive=false;hitTarget=true;break}
   }
   if(hitTarget){
    a.shot=null;
    if(a.guys.every(g=>!g.alive)){
     a.won=true;score+=3;$('score').textContent='⭐ '+score;
     $('msg').textContent=language==='ru'?'Отлично! Следующий уровень! 🎉':'Жарайсың! Келесі деңгей! 🎉';
     say(t().good[0]);arcNext=setTimeout(()=>{if(mode===4)nextRound()},1600);
    }else{
     $('msg').textContent=language==='ru'?'Попал! Стреляй ещё! 🎯':'Тиді! Тағы ат! 🎯';
    }
    break;
   }
   if(p.t>2400||p.bounces>45){a.shot=null;break}
  }
 }
 drawArcade();if(arcade&&arcade.shot)arcFrame=requestAnimationFrame(tickArcade)
}
function drawArcade(){
 if(mode!==4||!arcade)return;const can=$('arcade');if(!can)return;const ctx=can.getContext('2d');if(!ctx)return;
 const a=arcade;ctx.clearRect(0,0,330,440);
 let bg=ctx.createLinearGradient(0,0,0,440);bg.addColorStop(0,'#c9efff');bg.addColorStop(1,'#fff0c4');ctx.fillStyle=bg;ctx.fillRect(0,0,330,440);
 ctx.fillStyle='#a5d7aa';ctx.fillRect(0,406,330,34);
 ctx.lineWidth=7;ctx.lineCap='round';
 for(const [x,y,w,h] of a.walls){ctx.fillStyle='#9279c5';ctx.fillRect(x,y,w,h);ctx.fillStyle='#cbbaf1';ctx.fillRect(x,y,w,4)}
 ctx.textAlign='center';ctx.textBaseline='middle';
 for(const b of a.barrels)if(b.alive){ctx.font='33px system-ui';ctx.fillText('🛢️',b.x,b.y)}
 for(const g of a.guys)if(g.alive){ctx.font='36px system-ui';ctx.fillText('🥷',g.x,g.y)}
 ctx.font='46px system-ui';ctx.fillText('🧑‍🚀',47,371);
 if(a.shot){ctx.beginPath();ctx.arc(a.shot.x,a.shot.y,7,0,Math.PI*2);ctx.fillStyle='#ff9a17';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.stroke()}
 else if(!a.won){const vx=a.aim.x-48,vy=a.aim.y-372,mag=Math.hypot(vx,vy)||1;let px=48,py=372,dx=vx/mag*4,dy=vy/mag*4;
 ctx.strokeStyle='#7554c7';ctx.setLineDash([5,7]);ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(px,py);
 for(let j=0;j<115;j++){const ox=px,oy=py;px+=dx;py+=dy;
 if(px<9){px=9;dx=Math.abs(dx)}if(px>321){px=321;dx=-Math.abs(dx)}
 if(py<9){py=9;dy=Math.abs(dy)}if(py>427){py=427;dy=-Math.abs(dy)}
 for(const [wx,wy,ww,wh] of a.walls){if(px>wx-7&&px<wx+ww+7&&py>wy-7&&py<wy+wh+7){if(ox<wx-7||ox>wx+ww+7)dx*=-1;else dy*=-1;px=ox;py=oy}}
 ctx.lineTo(px,py);
 if(a.guys.some(g=>g.alive&&Math.hypot(px-g.x,py-g.y)<24)||a.barrels.some(b=>b.alive&&Math.hypot(px-b.x,py-b.y)<23))break;
 }ctx.stroke();ctx.setLineDash([])}
 ctx.font='bold 15px system-ui';ctx.fillStyle='#4d3b8d';ctx.textAlign='right';ctx.fillText((language==='ru'?'Выстрелы: ':'Оқ: ')+a.tries,316,23);
}

function newPairs(){
 const all=shuffle(catalog.animals.concat(catalog.produce.slice(0,36)));const picked=[],seen=new Set();
 for(const item of all){if(!seen.has(item[2])){picked.push(item);seen.add(item[2])}if(picked.length===3)break}
 const ids=[0,0,1,1,2,2];pair=shuffle(ids).map(i=>({icon:picked[i][2],ru:picked[i][0],kk:picked[i][1],done:false}));flipped=[];render()
}
function flip(i){
 if(mode!==3||busy||pair[i].done||flipped.includes(i))return;
 flipped.push(i);render();
 if(flipped.length===2){
  busy=true;const [a,b]=flipped,here=round;
  if(pair[a].icon===pair[b].icon){
   pair[a].done=pair[b].done=true;score++;$('score').textContent='⭐ '+score;
   setTimeout(()=>{if(mode!==3||round!==here)return;flipped=[];busy=false;render();
    if(pair.every(p=>p.done)){$('msg').textContent=t().pairWin;say(t().pairWin);autoAdvance(1600)}
   },650)
  }else{setTimeout(()=>{if(mode!==3||round!==here)return;flipped=[];busy=false;render()},900)}
 }
}
$('lang').onclick=()=>{language=language==='ru'?'kk':'ru';setup()};$('back').onclick=home;$('next').onclick=nextRound;$('repeat').onclick=()=>{if(mode===4)say(t().hints[4]);else if(mode===3)say(t().pairPrompt);else say(names()[target])};setup();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
