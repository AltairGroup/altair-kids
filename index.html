<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#8665ed"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Альтаир"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>Альтаир — учимся играя</title>
<style>
:root{font-family:system-ui,-apple-system,"Arial Rounded MT Bold",sans-serif;color:#29304b;background:#fcf7ff}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 10% 10%,#ffe9aa 0,transparent 35%),radial-gradient(circle at 95% 5%,#c9f1ff 0,transparent 36%),#fcf7ff}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}button:focus-visible{outline:4px solid #252166}main{max-width:720px;margin:auto;padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 25px)}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.small{font-size:14px;color:#636b89}.pill{border:0;border-radius:999px;padding:12px 18px;background:white;box-shadow:0 5px 14px #6555a126;font-weight:750}.hero{text-align:center;margin:26px 0 25px}.mascot{font-size:80px;filter:drop-shadow(0 8px 5px #53468b22)}h1{font-size:clamp(30px,8vw,48px);line-height:1.06;margin:4px 0 12px;color:#4931a3}h2{font-size:clamp(26px,6vw,36px);margin:12px 0 8px;text-align:center}.sub{font-size:18px;color:#666480;text-align:center;margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.tile{min-height:162px;border:0;border-radius:27px;padding:14px 8px;color:#302b53;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:22px;font-weight:850;box-shadow:0 7px 0 #49366324,0 12px 20px #46366014;transition:transform .12s}.tile:active,.choice:active{transform:scale(.96)}.tile .emoji{font-size:60px}.pink{background:#ffd2e1}.yellow{background:#fff0a7}.blue{background:#c9ebff}.green{background:#caf4d4}.back{background:white;border:0;border-radius:15px;padding:11px 14px;font-size:21px;font-weight:750;box-shadow:0 5px 15px #473a7f1a}.head{display:flex;align-items:center;justify-content:space-between;min-height:62px}.stars{font-size:23px;color:#b57c05;font-weight:900}.panel{background:#fff;border-radius:30px;padding:18px;box-shadow:0 10px 30px #55448b13;min-height:300px}.prompt{text-align:center;font-size:23px;font-weight:850;margin:10px 0 18px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.choice{border:4px solid transparent;border-radius:25px;min-height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:#f2ebff;font-size:19px;font-weight:850;color:#332e55;box-shadow:0 5px 0 #4d39751a}.choice span.figure{font-size:58px;line-height:1.25}.choice.color{min-height:118px}.choice .shape{height:65px;width:65px;display:block}.message{min-height:55px;text-align:center;font-size:22px;font-weight:850;color:#6b42c5;margin:17px 0 0}.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:16px}.primary{background:#7854ed;color:white;border:0;border-radius:20px;padding:15px 23px;font-size:19px;font-weight:800;box-shadow:0 6px 0 #4c2caa}.muted{background:white;border:2px solid #e2d9fe;border-radius:20px;padding:13px 20px;font-size:18px;font-weight:750}.pair-card{min-height:102px;background:#e7ddff;font-size:44px}.pair-card.open{background:#fff1bd;border-color:#c6a9ff}.pair-card.done{background:#d6f4d6;border-color:#9fdbaf}.arcade{display:block;width:100%;max-width:430px;margin:auto;aspect-ratio:3/4;background:#dbf1ff;border-radius:18px;touch-action:none}.arcade-note{text-align:center;font-size:16px;font-weight:700;padding-top:10px}.footer{text-align:center;font-size:13px;color:#817b9b;margin-top:24px}.hidden{display:none!important}@media(max-width:370px){.tile{min-height:138px}.tile .emoji{font-size:49px}.choice{min-height:100px}.pair-card{min-height:87px}}
</style></head><body><main><header class="top"><span class="small">⭐ Игра для Альтаира</span><button id="lang" class="pill" aria-label="Изменить язык">🇰🇿 Қазақша</button></header><section id="home"><div class="hero"><div class="mascot">🚀</div><h1 id="title">Привет, Альтаир!</h1><div class="sub" id="welcome">Давай играть и учиться! 🌈</div></div><div class="grid" id="menu"></div><div class="footer" id="foot">Без рекламы • Без покупок • Для малышей 💜</div></section><section id="game" class="hidden"><div class="head"><button class="back" id="back">← 🏠</button><span class="stars" id="score">⭐ 0</span></div><h2 id="gameTitle"></h2><div class="sub" id="gameHint"></div><div class="panel"><div class="prompt" id="prompt"></div><div class="choices" id="choices"></div><div id="msg" class="message" role="status" aria-live="polite"></div></div><div class="controls" id="controls"><button class="muted" id="repeat">🔊 Повторить</button><button class="primary" id="next">➡️ Дальше</button></div></section></main>
<script>
(()=>{'use strict';
const text={ru:{title:'Привет, Альтаир!',welcome:'Давай играть и учиться! 🌈',foot:'Без рекламы • Без покупок • Для малышей 💜',menus:['Цвета','Животные','Фигуры','Найди пару','Меткий Альтаир'],hints:['Найди правильный цвет','Кто это?','Найди правильную фигуру','Открывай одинаковые карточки','Коснись экрана, чтобы направить шарик в бандитов'],repeat:'🔊 Повторить',next:'➡️ Дальше',good:['Молодец! 🌟','Ура! 🎉','Правильно! 👏'],again:'Попробуй ещё! 💛',pairPrompt:'Найди две одинаковые картинки',pairWin:'Все пары найдены! Ура! 🎉',choose:'Найди:',tap:'Нажми на животное',namesColors:['Красный','Синий','Жёлтый','Зелёный','Оранжевый','Фиолетовый'],namesAnimals:['Кошка','Собака','Корова','Лошадь','Овечка','Утка'],namesShapes:['Круг','Квадрат','Треугольник','Звезда','Сердце','Ромб']},kk:{title:'Сәлем, Альтаир!',welcome:'Ойнап, бірге үйренейік! 🌈',foot:'Жарнамасыз • Сатып алусыз • Балаларға 💜',menus:['Түстер','Жануарлар','Пішіндер','Жұбын тап','Мерген Альтаир'],hints:['Дұрыс түсті тап','Бұл не?','Дұрыс пішінді тап','Бірдей екі суретті аш','Допты қарақшыларға бағыттау үшін экранды түрт'],repeat:'🔊 Қайталау',next:'➡️ Келесі',good:['Жарайсың! 🌟','Алақай! 🎉','Дұрыс! 👏'],again:'Қайта көр! 💛',pairPrompt:'Екі бірдей суретті тап',pairWin:'Барлық жұп табылды! 🎉',choose:'Тап:',tap:'Жануарды бас',namesColors:['Қызыл','Көк','Сары','Жасыл','Қызғылт сары','Күлгін'],namesAnimals:['Мысық','Ит','Сиыр','Жылқы','Қой','Үйрек'],namesShapes:['Дөңгелек','Шаршы','Үшбұрыш','Жұлдыз','Жүрек','Ромб']}};
const colors=['#f04f63','#4e9af4','#ffe05c','#57ca8a','#ff9c45','#a26ae9'],animals=['🐱','🐶','🐮','🐴','🐑','🦆'],shapes=['●','■','▲','★','♥','◆'];const icons=['🎨','🐮','🔺','🧩','🎯'];const classes=['pink','yellow','blue','green','yellow'];let language='ru',mode=-1,score=0,round=0,target=0,selection=[],pair=[],flipped=[],busy=false,answered=false,voice='',advanceTimer=null;const $=id=>document.getElementById(id),t=()=>text[language];
function say(v){voice=v;if(!v||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();let utter=new SpeechSynthesisUtterance(v);utter.lang=language==='kk'?'kk-KZ':'ru-RU';utter.rate=.82;utter.pitch=1.12;speechSynthesis.speak(utter)}catch(e){}}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function rand(n){return Math.floor(Math.random()*n)}function setup(){['title','welcome','foot'].forEach(k=>$(k).textContent=t()[k]);$('lang').textContent=language==='ru'?'🇰🇿 Қазақша':'🇷🇺 Русский';$('menu').innerHTML='';t().menus.forEach((name,i)=>{let b=document.createElement('button');b.className='tile '+classes[i];b.innerHTML=`<span class="emoji">${icons[i]}</span><span>${name}</span>`;b.onclick=()=>start(i);$('menu').appendChild(b)});$('repeat').textContent=t().repeat;$('next').textContent=t().next;if(mode>=0){$('gameTitle').textContent=t().menus[mode];$('gameHint').textContent=t().hints[mode];render()}}
function autoAdvance(delay=1200){clearTimeout(advanceTimer);advanceTimer=setTimeout(()=>{advanceTimer=null;if(mode>=0)nextRound()},delay)}
function start(i){stopArcade();clearTimeout(advanceTimer);mode=i;score=0;round=0;$('home').classList.add('hidden');$('game').classList.remove('hidden');$('choices').style.display='grid';$('controls').classList.remove('hidden');$('gameTitle').textContent=t().menus[i];$('gameHint').textContent=t().hints[i];nextRound()}
function home(){stopArcade();clearTimeout(advanceTimer);mode=-1;try{speechSynthesis.cancel()}catch(e){}$('game').classList.add('hidden');$('home').classList.remove('hidden')}
function nextRound(){clearTimeout(advanceTimer);round++;if(mode===4){startArcade();return;}answered=false;busy=false;$('msg').textContent='';$('score').textContent='⭐ '+score;$('next').classList.add('hidden');if(mode===3){newPairs();return;}target=rand(6);selection=shuffle([target,...shuffle([0,1,2,3,4,5].filter(i=>i!==target)).slice(0,3)]);render()}
function render(){if(mode<0)return;if(mode===4){drawArcade();return;}$('prompt').textContent=mode===3?t().pairPrompt:mode===1?t().tap:t().choose+' '+(mode===0?t().namesColors[target]:t().namesShapes[target]);$('choices').innerHTML='';if(mode===3){pair.forEach((item,i)=>{let b=document.createElement('button');b.className='choice pair-card'+(flipped.includes(i)?' open':'')+(pair[i].done?' done':'');b.textContent=(flipped.includes(i)||pair[i].done)?animals[item.id]:'❔';b.setAttribute('aria-label',b.textContent);b.onclick=()=>flip(i);$('choices').appendChild(b)});return;}selection.forEach(i=>{let b=document.createElement('button');b.className='choice'+(mode===0?' color':'');if(mode===0){b.style.background=colors[i];b.setAttribute('aria-label',t().namesColors[i])}if(mode===1){b.innerHTML='<span class="figure">'+animals[i]+'</span><span>'+t().namesAnimals[i]+'</span>'}if(mode===2){b.innerHTML='<span class="figure" style="color:'+colors[i]+'">'+shapes[i]+'</span><span>'+t().namesShapes[i]+'</span>'}b.onclick=()=>pick(i);$('choices').appendChild(b)});if(mode===0||mode===2)say((mode===0?t().namesColors:t().namesShapes)[target]);}
function pick(i){if(answered)return;if(mode===1){score++;$('score').textContent='⭐ '+score;$('msg').textContent=t().namesAnimals[i]+' '+animals[i];say(t().namesAnimals[i]);answered=true;autoAdvance(1300);return}if(i===target){score++;$('score').textContent='⭐ '+score;$('msg').textContent=t().good[rand(3)];say(t().good[0]);answered=true;autoAdvance(1200)}else{$('msg').textContent=t().again;say(t().again)}}

let arcade=null,arcFrame=0,arcNext=0;
const levels=[
 {guys:[[260,95]],walls:[],barrels:[]},
 {guys:[[252,130]],walls:[[155,180,110,15]],barrels:[]},
 {guys:[[255,108],[260,320]],walls:[[120,210,90,14]],barrels:[]},
 {guys:[[250,125],[275,285]],walls:[[145,205,100,16]],barrels:[[225,245]]},
 {guys:[[90,100],[265,110],[265,320]],walls:[[120,185,130,16],[65,280,145,14]],barrels:[[255,268]]},
 {guys:[[85,90],[250,100],[255,280]],walls:[[90,160,135,15],[142,245,120,15]],barrels:[[230,225]]}
];
function stopArcade(){if(arcFrame)cancelAnimationFrame(arcFrame);arcFrame=0;clearTimeout(arcNext);arcNext=0;arcade=null}
function startArcade(){
 stopArcade();
 const n=Math.max(0,round-1),base=levels[Math.min(n,levels.length-1)];
 arcade={guys:base.guys.map(([x,y])=>({x,y,alive:true})),walls:base.walls.map(a=>a.slice()),barrels:base.barrels.map(([x,y])=>({x,y,alive:true})),shot:null,aim:{x:260,y:150},tries:0,won:false};
 $('controls').classList.add('hidden');$('prompt').textContent=(language==='ru'?'Уровень ':'Деңгей ')+round;
 $('msg').textContent=language==='ru'?'Нажми на поле — стреляй!':'Алаңды бас — ат!';
 $('choices').innerHTML='<canvas id="arcade" class="arcade" width="330" height="440" aria-label="Игра с рикошетом"></canvas><div class="arcade-note">'+(language==='ru'?'🎯 Целься и стреляй, шарик отскакивает от стен':'🎯 Нысанаға тигіз, доп қабырғадан секіреді')+'</div>';
 $('choices').style.display='block';
 const can=$('arcade');
 can.addEventListener('pointerdown',e=>{if(!arcade||arcade.won||arcade.shot)return;const r=can.getBoundingClientRect();const x=(e.clientX-r.left)*330/r.width,y=(e.clientY-r.top)*440/r.height;shootArcade(x,y)});
 drawArcade();
}
function shootArcade(x,y){
 if(!arcade)return;let dx=x-48,dy=y-372,mag=Math.hypot(dx,dy)||1;
 arcade.aim={x,y};arcade.shot={x:48,y:372,vx:dx/mag*5.8,vy:dy/mag*5.8,t:0,bounces:0};
 arcade.tries++;if(!arcFrame)arcFrame=requestAnimationFrame(tickArcade);
}
function tickArcade(){
 arcFrame=0;if(!arcade||mode!==4)return;
 const a=arcade,p=a.shot;
 if(p){
  for(let z=0;z<3;z++){
   const ox=p.x,oy=p.y;
   p.x+=p.vx/3;p.y+=p.vy/3;p.t++;
   if(p.x<9){p.x=9;p.vx=Math.abs(p.vx);p.bounces++}
   if(p.x>321){p.x=321;p.vx=-Math.abs(p.vx);p.bounces++}
   if(p.y<9){p.y=9;p.vy=Math.abs(p.vy);p.bounces++}
   if(p.y>427){p.y=427;p.vy=-Math.abs(p.vy);p.bounces++}
   for(const [wx,wy,ww,wh] of a.walls){
    if(p.x>wx-7&&p.x<wx+ww+7&&p.y>wy-7&&p.y<wy+wh+7){
      if(ox<wx-7||ox>wx+ww+7)p.vx*=-1;else p.vy*=-1;
      p.x=ox;p.y=oy;p.bounces++;
    }
   }
   for(const b of a.barrels)if(b.alive&&Math.hypot(p.x-b.x,p.y-b.y)<23){b.alive=false;for(const g of a.guys)if(g.alive&&Math.hypot(b.x-g.x,b.y-g.y)<110)g.alive=false;p.vx*=-1;p.vy*=-1}
   for(const g of a.guys)if(g.alive&&Math.hypot(p.x-g.x,p.y-g.y)<24){g.alive=false;p.vx*=-1;p.vy*=-1}
   if(a.guys.every(g=>!g.alive)){a.won=true;a.shot=null;score+=3;$('score').textContent='⭐ '+score;$('msg').textContent=language==='ru'?'Отлично! Следующий уровень! 🎉':'Жарайсың! Келесі деңгей! 🎉';say(t().good[0]);arcNext=setTimeout(()=>{if(mode===4)nextRound()},1600);break}
   if(p.t>420||p.bounces>16){a.shot=null;break}
  }
 }
 drawArcade();if(arcade&&arcade.shot)arcFrame=requestAnimationFrame(tickArcade)
}
function drawArcade(){
 if(mode!==4||!arcade)return;const can=$('arcade');if(!can)return;const ctx=can.getContext('2d');if(!ctx)return;
 const a=arcade;ctx.clearRect(0,0,330,440);
 let bg=ctx.createLinearGradient(0,0,0,440);bg.addColorStop(0,'#c9efff');bg.addColorStop(1,'#fff0c4');ctx.fillStyle=bg;ctx.fillRect(0,0,330,440);
 ctx.fillStyle='#a5d7aa';ctx.fillRect(0,406,330,34);
 ctx.lineWidth=7;ctx.lineCap='round';
 for(const [x,y,w,h] of a.walls){ctx.fillStyle='#9279c5';ctx.fillRect(x,y,w,h);ctx.fillStyle='#cbbaf1';ctx.fillRect(x,y,w,4)}
 ctx.textAlign='center';ctx.textBaseline='middle';
 for(const b of a.barrels)if(b.alive){ctx.font='33px system-ui';ctx.fillText('🛢️',b.x,b.y)}
 for(const g of a.guys)if(g.alive){ctx.font='36px system-ui';ctx.fillText('🥷',g.x,g.y)}
 ctx.font='46px system-ui';ctx.fillText('🧑‍🚀',47,371);
 if(a.shot){ctx.beginPath();ctx.arc(a.shot.x,a.shot.y,7,0,Math.PI*2);ctx.fillStyle='#ff9a17';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.stroke()}
 else if(!a.won){ctx.strokeStyle='#7554c7';ctx.setLineDash([5,8]);ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(49,366);ctx.lineTo(a.aim.x,a.aim.y);ctx.stroke();ctx.setLineDash([])}
 ctx.font='bold 15px system-ui';ctx.fillStyle='#4d3b8d';ctx.textAlign='right';ctx.fillText((language==='ru'?'Выстрелы: ':'Оқ: ')+a.tries,316,23);
}

function newPairs(){const ids=shuffle([0,1,2,3,4,5]).slice(0,3);pair=shuffle([...ids,...ids]).map(id=>({id,done:false}));flipped=[];render()}
function flip(i){if(busy||pair[i].done||flipped.includes(i))return;flipped.push(i);render();if(flipped.length===2){busy=true;const [a,b]=flipped;if(pair[a].id===pair[b].id){pair[a].done=pair[b].done=true;score++;$('score').textContent='⭐ '+score;say(t().good[0]);setTimeout(()=>{flipped=[];busy=false;render();if(pair.every(p=>p.done)){$('msg').textContent=t().pairWin;say(t().pairWin);autoAdvance(1500)}},650)}else{setTimeout(()=>{flipped=[];busy=false;render()},950)}}}
$('lang').onclick=()=>{language=language==='ru'?'kk':'ru';setup()};$('back').onclick=home;$('next').onclick=nextRound;$('repeat').onclick=()=>{if(mode===4)say(t().hints[4]);else if(mode===3)say(t().pairPrompt);else if(mode===1)say(t().tap);else say((mode===0?t().namesColors:t().namesShapes)[target])};setup();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
